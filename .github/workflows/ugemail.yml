name: Ugemail og systemalarm

# Indført 19/10-2026, så KP kan følge med under barslen uden en tændt pc.
# Dagligt: tools/sundhedstjek.py - alarmmail til kp@dnnk.dk, KUN hvis noget fejler.
# Fredag: ugemail med ugens vurderede fund (fra cloud-rutinen) + systemstatus.
# Mailen sendes af Render (/send-ugemail) via Brevo, som den gamle digest.
# Tider i UTC: alarm 05:20 = 6:20 dansk vintertid / 7:20 sommertid.
# Fredagsmail: cloud-rutinen "DNNK klimamonitor - ugevurdering" starter selv dette workflow
# (workflow_dispatch, tilstand=uge, test=false), når den har pushet vurderingen. GitHubs
# planlagte kørsler kommer ofte timer for sent eller slet ikke. Fredagens cron 07:20 UTC
# er derfor kun en reserve, der springer over, hvis rutinen allerede har sendt ugemailen.

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Ugemail ({0}{1})', inputs.tilstand, inputs.test && ', TEST' || '') || 'Ugemail og systemalarm' }}

on:
  schedule:
    - cron: '20 5 * * 1-4,6,0'   # alle dage undtagen fredag: kun alarm ved fejl
    - cron: '20 7 * * 5'         # fredag: reserve, hvis cloud-rutinen ikke selv har sendt ugemailen
  workflow_dispatch:
    inputs:
      tilstand:
        description: 'uge = fuld ugemail, alarm = kun ved fejl'
        default: 'uge'
        type: choice
        options: [uge, alarm]
      test:
        description: 'Markér mailen som TEST'
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  tjek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx

      - name: Vælg tilstand
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tilstand=${{ inputs.tilstand }}" >> $GITHUB_OUTPUT
            echo "test=${{ inputs.test }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "20 7 * * 5" ]; then
            echo "tilstand=uge" >> $GITHUB_OUTPUT; echo "test=false" >> $GITHUB_OUTPUT
          else
            echo "tilstand=alarm" >> $GITHUB_OUTPUT; echo "test=false" >> $GITHUB_OUTPUT
          fi

      - name: Fredagsreserve - er ugemailen allerede sendt i dag?
        id: sendt
        if: github.event_name == 'schedule' && github.event.schedule == '20 7 * * 5'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDAG=$(date -u +%Y-%m-%d)
          ANTAL=$(gh api "repos/${{ github.repository }}/actions/workflows/ugemail.yml/runs?event=workflow_dispatch&created=>=$IDAG&per_page=50" \
            --jq '[.workflow_runs[] | select(.display_title == "Ugemail (uge)" and (.conclusion == "success" or .status != "completed"))] | length')
          echo "Ugemails sendt (eller i gang) fra rutinen i dag: $ANTAL"
          if [ "$ANTAL" -gt 0 ]; then echo "spring=true" >> $GITHUB_OUTPUT; else echo "spring=false" >> $GITHUB_OUTPUT; fi

      - name: Sundhedstjek
        if: steps.sendt.outputs.spring != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARG=""; [ "${{ steps.t.outputs.tilstand }}" = "uge" ] && ARG="--uge"
          python tools/sundhedstjek.py $ARG > /tmp/sundhed.json
          cat /tmp/sundhed.json

      - name: Send mail via Render
        if: steps.sendt.outputs.spring != 'true'
        run: |
          KUN_ALARM=false; [ "${{ steps.t.outputs.tilstand }}" = "alarm" ] && KUN_ALARM=true
          python - <<EOF > /tmp/body.json
          import json
          print(json.dumps({"sundhed": json.load(open("/tmp/sundhed.json")),
                            "test": "${{ steps.t.outputs.test }}" == "true",
                            "kun_alarm": $( [ "$KUN_ALARM" = true ] && echo True || echo False )}))
          EOF
          curl --fail-with-body --max-time 180 --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST -H "Content-Type: application/json" -H "X-DNNK-Code: ${{ secrets.DNNK_ACCESS_CODE }}" \
            --data @/tmp/body.json "https://dnnk-klimamonitor-proxy.onrender.com/send-ugemail" | tee /tmp/svar.json
          echo
          python -c "import json,sys; d=json.load(open('/tmp/svar.json')); sys.exit(0 if d.get('sendt') or d.get('grund') else 1)"
