name: Ugedata til vurdering

# Cloud-rutinen "DNNK klimamonitor - ugevurdering" (fredag 04:00 UTC) kan ikke nå
# Render fra Anthropics cloud (netværksbegrænsning). Dette job henter derfor
# klimamonitorens fund en halv time før og lægger dem som ugedata.json på
# branchen claude/ugevurdering, hvor rutinen læser dem.

on:
  schedule:
    - cron: '30 3 * * 5'   # fredag 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hent fund fra klimamonitoren
        run: |
          R=https://dnnk-klimamonitor-proxy.onrender.com
          curl -s -o /dev/null --max-time 150 "$R/" || true   # væk serveren
          curl --fail --max-time 180 --retry 3 --retry-delay 30 --retry-all-errors \
            -o /tmp/full.json "$R/news/full?q=klimatilpasning&limit=40"
          sleep 70   # første scrape efter opvågning kan ramme negativ cache (60 s)
          curl --fail --max-time 180 --retry 3 --retry-delay 30 --retry-all-errors \
            -o /tmp/scrape.json "$R/news/scrape?q=klimatilpasning&limit=20"
          python3 - <<'EOF'
          import json, datetime
          full = json.load(open("/tmp/full.json")); scrape = json.load(open("/tmp/scrape.json"))
          sete, artikler = set(), []
          for a in full.get("articles", []) + scrape.get("articles", []):
              if a.get("url") and a["url"] not in sete:
                  sete.add(a["url"]); artikler.append(a)
          json.dump({"hentet": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     "antal": len(artikler), "fejlede_kilder": scrape.get("fejlede_kilder", []),
                     "articles": artikler}, open("/tmp/ugedata.json", "w"), ensure_ascii=False, indent=1)
          print(len(artikler), "artikler")
          EOF

      - uses: actions/checkout@v4
        with:
          ref: claude/ugevurdering

      - name: Gem på claude/ugevurdering
        run: |
          cp /tmp/ugedata.json .
          git config user.name "dnnk-ugedata"
          git config user.email "actions@users.noreply.github.com"
          git add ugedata.json
          git diff --cached --quiet || git commit -qm "Ugedata $(date +%F)"
          git push origin claude/ugevurdering
